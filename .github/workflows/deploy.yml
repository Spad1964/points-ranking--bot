name: Deploy Bot

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/admin/lore-actors-bot/lore-points-bot
          git fetch origin main
          git reset --hard origin/main

      - name: Restart bot
        run: |
          sudo systemctl restart lorebot